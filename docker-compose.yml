services:
  postgres:
    image: postgres:16.6-alpine
    container_name: openrecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrecon_password}
      POSTGRES_DB: ${POSTGRES_DB:-openrecon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-data-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrecon} -d ${POSTGRES_DB:-openrecon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.1-alpine
    container_name: openrecon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal-data-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated Isolated Tor SOCKS5 Sandbox (Zero-Privilege)
  tor-proxy:
    image: alpine:3.19.4
    container_name: openrecon-tor-sandbox
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache tor &&
             mkdir -p /var/lib/tor &&
             chown -R tor:nogroup /var/lib/tor &&
             chmod 700 /var/lib/tor &&
             su -s /bin/sh tor -c 'tor -f /etc/tor/torrc'"
    volumes:
      - ./docker/tor/torrc:/etc/tor/torrc:ro
      - tor_data:/var/lib/tor
    networks:
      - tor-sandbox-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openrecon-api
    restart: unless-stopped
    command: python -m scripts.docker_entrypoint
    volumes:
      - evidences_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openrecon}:${POSTGRES_PASSWORD:-openrecon_password}@postgres:5432/${POSTGRES_DB:-openrecon}
      - REDIS_URL=redis://redis:6379/0
      - TOR_PROXY_URL=socks5h://tor-proxy:9050
      - SECRET_KEY=${SECRET_KEY:-replace_this_with_a_secure_random_key_in_production}
      - OPENRECON_API_TOKEN=${OPENRECON_API_TOKEN:-}
      - OPENRECON_MASTER_KEY=${OPENRECON_MASTER_KEY:-}
      - SAFE_MODE=${SAFE_MODE:-true}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-15}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
    networks:
      - frontend-net
      - internal-data-net
      - tor-sandbox-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor-proxy:
        condition: service_started

  recon-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: openrecon-recon-worker
    restart: unless-stopped
    volumes:
      - evidences_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openrecon}:${POSTGRES_PASSWORD:-openrecon_password}@postgres:5432/${POSTGRES_DB:-openrecon}
      - REDIS_URL=redis://redis:6379/0
      - TOR_PROXY_URL=socks5h://tor-proxy:9050
      - SECRET_KEY=${SECRET_KEY:-replace_this_with_a_secure_random_key_in_production}
      - OPENRECON_MASTER_KEY=${OPENRECON_MASTER_KEY:-}
      - SAFE_MODE=${SAFE_MODE:-true}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-15}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
    networks:
      - internal-data-net
      - recon-egress-net
      - tor-sandbox-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: openrecon-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - sqlite_legacy_data:/var/www/html/legacy_state
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - OPENRECON_API_URL=http://api:8000
      - OPENRECON_API_TOKEN=${OPENRECON_API_TOKEN:-}
      - OPENRECON_DOCKER_MODE=true
    networks:
      - frontend-net
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend-net:
    driver: bridge
  internal-data-net:
    driver: bridge
    internal: true
  recon-egress-net:
    driver: bridge
  tor-sandbox-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  tor_data:
  evidences_data:
  sqlite_legacy_data:
